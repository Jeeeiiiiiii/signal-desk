# The cluster half of the lab.
#
# k3s runs BESIDE the emulated EC2 instance rather than inside it. Docker
# Desktop's WSL2 VM refuses to delegate cgroup v2 controllers to a nested
# container, so kubelet cannot create the `kubepods` cgroup in there:
#
#   cannot enter cgroupv2 "/sys/fs/cgroup/kubepods" with domain controllers
#
# The Terraform still provisions the instance and its bootstrap, which is what
# runs in real AWS. See "Known weaknesses" in the README.
services:
  k3s:
    image: rancher/k3s:v1.31.5-k3s1
    command:
      - server
      - --disable=traefik
      - --disable=metrics-server
      - --write-kubeconfig-mode=644
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - ./.cluster:/output
      - k3s-server:/var/lib/rancher/k3s
    ports:
      - "6443:6443"
      - "30080:30080"   # triage app NodePort
      - "30081:30081"   # Argo CD UI
    networks:
      - floci_default

  # A real git remote for Argo CD to pull from.
  #
  # Argo CD's whole model is "the cluster reconciles toward what git says", so
  # demonstrating it needs an actual git server rather than a local directory.
  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data
    networks:
      - floci_default

volumes:
  k3s-server:
  gitea-data:

networks:
  floci_default:
    external: true
