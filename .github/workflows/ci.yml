name: ci

on:
  push:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-triage

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q tests/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  build:
    needs: [test, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the manifest bump
      packages: write   # to push the image
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # This is the entire handoff to CD. CI never touches the cluster — it
      # edits a file and pushes. Argo CD, running inside the cluster, notices
      # and pulls. Nothing outside the cluster holds credentials to it.
      - name: Bump image tag in manifests
        run: |
          sed -i "s|image: .*signal-desk-triage:.*|image: ${IMAGE}:${GITHUB_SHA}|" manifests/deployment.yaml
          git config user.name  "ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA}" && git push
