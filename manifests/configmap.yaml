apiVersion: v1
kind: ConfigMap
metadata:
  name: triage
  namespace: signal-desk
data:
  # An IP, not the name "floci". Pods resolve through CoreDNS, which forwards to
  # the node's resolver — and the node's Docker-embedded DNS (127.0.0.11) is not
  # reachable from inside a pod's network namespace. In AWS this is a real
  # DNS name; locally the emulator's address is pinned.
  endpoint: "http://<NEW_IP>:4566"
  queue_url: "http://<NEW_IP>:4566/000000000000/signal-desk-events"
  auth_mode: "off"
