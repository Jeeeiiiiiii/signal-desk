# CoreDNS forwards to whatever resolver kubelet hands its pods. Inside Docker
# the node resolv.conf says 127.0.0.11 -- the embedded DNS -- which is a
# loopback address valid only in the k3s container's own netns. A pod that
# inherits it resolves against its own empty loopback, so nothing in the
# cluster can reach a public name. Argo CD pulls from github.com, so it needs
# one that is routable from a pod.
#
# 192.168.65.7 is Docker Desktop's host-gateway DNS proxy: the same upstream
# the node's own resolv.conf names in its "ExtServers: [host(...)]" comment.
# Public resolvers are deliberately NOT used here -- 1.1.1.1 and 8.8.8.8 are
# unreachable from this network, and hardcoding them fails on any corporate
# egress filter. If this address ever changes, read it back out of:
#
#   docker exec signal-desk-k3s-1 cat /etc/resolv.conf
#
nameserver 192.168.65.7
