# The GitOps contract.
#
# Nothing outside the cluster holds credentials to it. CI pushes a commit; this
# controller, running inside the cluster, notices and pulls. Deploys are commits.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signal-desk
  namespace: argocd
spec:
  project: default

  source:
    # The real remote. Argo CD's repo-server pod clones this over the internet,
    # anonymously - the repo is public and read-only to the cluster. CI pushes
    # here; the cluster pulls from here. One chain, no mirror to keep in sync.
    repoURL: https://github.com/Jeeeiiiiiii/signal-desk.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: signal-desk

  syncPolicy:
    automated:
      prune: true      # a manifest deleted from git is deleted from the cluster
      selfHeal: true   # a manual kubectl edit is reverted to what git says
    syncOptions:
      - CreateNamespace=true
